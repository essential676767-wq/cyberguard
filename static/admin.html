<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — CyberGuard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen">
    <nav class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🛡️</span>
            <span class="text-xl font-bold text-slate-900">CyberGuard Admin</span>
        </div>
        <a href="/dashboard" class="text-sm text-blue-800 hover:underline">Вернуться в кабинет</a>
    </nav>

    <main class="max-w-6xl mx-auto p-6 flex gap-6">
        <!-- Список чатов -->
        <div class="w-1/3 bg-white rounded-xl shadow-sm border border-gray-200 p-4">
            <h2 class="font-bold text-lg mb-4 text-slate-800">Чаты клиентов</h2>
            <div id="chatList" class="space-y-2"></div>
        </div>

        <!-- Окно чата -->
        <div class="w-2/3 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-[600px]">
            <div class="p-4 border-b border-gray-200 bg-gray-50 rounded-t-xl">
                <h2 id="activeChatName" class="font-bold text-slate-800">Выберите чат</h2>
            </div>
            <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50"></div>
            <div class="p-4 border-t border-gray-200 flex gap-2">
                <input type="text" id="replyInput" placeholder="Напишите ответ..." class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-800" disabled>
                <button onclick="sendReply()" id="sendBtn" class="bg-blue-800 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-900 disabled:opacity-50" disabled>Отправить</button>
            </div>
        </div>
    </main>

    <script>
        let currentUserId = null;

        async function loadChats() {
            const token = localStorage.getItem('token');
            const response = await fetch('/api/admin/chats', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                const chats = await response.json();
                const list = document.getElementById('chatList');
                list.innerHTML = '';
                chats.forEach(chat => {
                    const div = document.createElement('div');
                    div.className = 'p-3 border border-gray-100 rounded-lg cursor-pointer hover:bg-gray-50';
                    div.innerHTML = `
                        <div class="font-semibold text-sm">${chat.email}</div>
                        <div class="text-xs text-gray-500">${chat.messages[chat.messages.length - 1].text.substring(0, 30)}...</div>
                    `;
                    div.onclick = () => openChat(chat);
                    list.appendChild(div);
                });
            }
        }

        function openChat(chat) {
            currentUserId = chat.user_id;
            document.getElementById('activeChatName').textContent = chat.email;
            document.getElementById('replyInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;

            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            chat.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = msg.is_admin
                    ? 'bg-blue-100 text-blue-900 p-3 rounded-lg ml-auto max-w-[80%] w-fit'
                    : 'bg-white border border-gray-200 text-slate-800 p-3 rounded-lg mr-auto max-w-[80%] w-fit';
                div.textContent = msg.text;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendReply() {
            const input = document.getElementById('replyInput');
            const text = input.value;
            if (!text || !currentUserId) return;

            const token = localStorage.getItem('token');
            const response = await fetch('/api/admin/reply', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ user_id: currentUserId, text: text })
            });

            if (response.ok) {
                input.value = '';
                loadChats(); // Обновляем список
                // Добавляем сообщение в окно
                const container = document.getElementById('chatMessages');
                const div = document.createElement('div');
                div.className = 'bg-blue-100 text-blue-900 p-3 rounded-lg ml-auto max-w-[80%] w-fit';
                div.textContent = text;
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            }
        }

        loadChats();
    </script>
</body>
</html>
