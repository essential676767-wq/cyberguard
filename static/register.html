<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — CyberGuard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .btn-primary { background-color: #1e3a8a; color: white; transition: background 0.2s; }
        .btn-primary:hover { background-color: #1e40af; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-md border border-gray-200 w-full max-w-md">
        <div class="text-center mb-8">
            <span class="text-4xl">🛡️</span>
            <h2 class="text-2xl font-bold text-slate-900 mt-2">Регистрация</h2>
            <p class="text-slate-500 text-sm mt-1">Создайте аккаунт для заказа услуг</p>
        </div>

        <!-- Шаг 1: Форма регистрации -->
        <div id="step1">
            <form id="registerForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input type="email" id="username" required class="w-full bg-slate-50 border border-gray-300 rounded-md px-4 py-2.5 text-slate-900 focus:outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Пароль</label>
                    <input type="password" id="password" required class="w-full bg-slate-50 border border-gray-300 rounded-md px-4 py-2.5 text-slate-900 focus:outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800">
                </div>
