<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — CyberGuard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .btn-primary { background-color: #1e3a8a; color: white; transition: background 0.2s; }
        .btn-primary:hover { background-color: #1e40af; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-md border border-gray-200 w-full max-w-md">
        <div class="text-center mb-8">
            <span class="text-4xl">🛡️</span>
            <h2 class="text-2xl font-bold text-slate-900 mt-2">Регистрация</h2>
            <p class="text-slate-500 text-sm mt-1">Создайте аккаунт для заказа услуг</p>
        </div>

        <!-- Шаг 1: Форма регистрации -->
        <div id="step1">
            <form id="registerForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input type="email" id="username" required class="w-full bg-slate-50 border border-gray-300 rounded-md px-4 py-2.5 text-slate-900 focus:outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Пароль</label>
                    <input type="password" id="password" required class="w-full bg-slate-50 border border-gray-300 rounded-md px-4 py-2.5 text-slate-900 focus:outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800">
                </div>
                
                <div class="flex items-start">
                    <div class="flex items-center h-5">
                        <input id="terms" name="terms" type="checkbox" required class="focus:ring-blue-500 h-4 w-4 text-blue-800 border-gray-300 rounded">
                    </div>
                    <div class="ml-3 text-sm">
                        <label for="terms" class="font-medium text-slate-700">
                            Я согласен с <a href="/terms" target="_blank" class="text-blue-800 hover:underline">условиями</a> и <a href="/privacy" target="_blank" class="text-blue-800 hover:underline">политикой конфиденциальности</a>
                        </label>
                    </div>
                </div>

                <button type="submit" class="w-full btn-primary py-3 rounded-md font-semibold text-white">Создать аккаунт</button>
            </form>
        </div>

        <!-- Шаг 2: Ввод кода -->
        <div id="step2" class="hidden">
            <div class="text-center mb-6">
                <span class="text-4xl">📩</span>
                <h3 class="text-xl font-bold text-slate-900 mt-2">Введите код</h3>
                <p class="text-slate-500 text-sm">Ваш код подтверждения (скопируйте его):</p>
                <p id="codeDisplay" class="text-3xl font-bold text-blue-800 tracking-widest mt-2 bg-blue-50 p-2 rounded"></p>
            </div>
            <form id="verifyForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Код</label>
                    <input type="text" id="verifyCode" required class="w-full bg-slate-50 border border-gray-300 rounded-md px-4 py-2.5 text-slate-900 focus:outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800 text-center text-2xl tracking-widest">
                </div>
                <button type="submit" class="w-full btn-primary py-3 rounded-md font-semibold text-white">Подтвердить</button>
            </form>
        </div>

        <p class="text-center text-slate-500 mt-6 text-sm">Уже есть аккаунт? <a href="/login" class="text-blue-800 font-medium hover:underline">Войти</a></p>
    </div>

    <script>
        let registeredEmail = "";

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            registeredEmail = username;

            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);
            
            const response = await fetch('/register', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, 
                body: formData 
            });
            
            if (response.ok) {
                const data = await response.json();
                // Показываем код на экране
                document.getElementById('codeDisplay').textContent = data.code; 
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
            } else {
                const error = await response.json();
                alert('Ошибка: ' + error.detail);
            }
        });

        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('verifyCode').value;
            
            const response = await fetch(`/api/verify_code?email=${encodeURIComponent(registeredEmail)}&code=${encodeURIComponent(code)}`, {
                method: 'POST'
            });
            
            if (response.ok) {
                alert('Почта подтверждена! Теперь войдите.');
                window.location.href = '/login';
            } else {
                const error = await response.json();
                alert('Ошибка: ' + error.detail);
            }
        });
    </script>
</body>
</html>
