<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — CyberGuard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .btn-primary { background-color: #1e3a8a; color: white; transition: background 0.2s; }
        .btn-primary:hover { background-color: #1e40af; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-md border border-gray-200 w-full max-w-md">
        <div class="text-center mb-8">
            <span class="text-4xl">🛡️</span>
            <h2 class="text-2xl font-bold text-slate-900 mt-2">Вход в CyberGuard</h2>
            <p class="text-slate-500 text-sm mt-1">Введите данные вашего аккаунта</p>
        </div>
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="text" id="username" required class="w-full bg-slate-50 border border-gray-300 rounded-md px-4 py-2.5 text-slate-900 focus:outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Пароль</label>
                <input type="password" id="password" required class="w-full bg-slate-50 border border-gray-300 rounded-md px-4 py-2.5 text-slate-900 focus:outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800">
            </div>
            <button type="submit" class="w-full btn-primary py-3 rounded-md font-semibold text-white">Войти</button>
        </form>

        <div class="mt-6 text-center text-sm space-y-2">
            <p class="text-slate-500">Нет аккаунта? <a href="/register" class="text-blue-800 font-medium hover:underline">Зарегистрироваться</a></p>
            <p class="text-slate-500"><a href="/verify" class="text-blue-800 font-medium hover:underline">Подтвердить почту (ввести код)</a></p>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);

            const response = await fetch('/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formData });
            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                document.cookie = `access_token=${data.access_token}; path=/; max-age=${7 * 24 * 60 * 60}; SameSite=Lax`;
                window.location.href = '/dashboard';
            } else {
                const error = await response.json();
                alert('Ошибка: ' + (error.detail || 'Неверный логин или пароль'));
            }
        });
    </script>
</body>
</html>
