<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение почты — CyberGuard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .btn-primary { background-color: #1e3a8a; color: white; transition: background 0.2s; }
        .btn-primary:hover { background-color: #1e40af; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-md border border-gray-200 w-full max-w-md">
        <div class="text-center mb-8">
            <span class="text-4xl">🛡️</span>
            <h2 class="text-2xl font-bold text-slate-900 mt-2">Подтверждение почты</h2>
            <p class="text-slate-500 text-sm mt-1">Введите email и код из письма</p>
        </div>

        <form id="verifyForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" id="email" required class="w-full bg-slate-50 border border-gray-300 rounded-md px-4 py-2.5 text-slate-900 focus:outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Код из письма</label>
                <input type="text" id="code" required class="w-full bg-slate-50 border border-gray-300 rounded-md px-4 py-2.5 text-slate-900 focus:outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800">
            </div>
            <button type="submit" class="w-full btn-primary py-3 rounded-md font-semibold text-white">Подтвердить</button>
        </form>

        <p class="text-center text-slate-500 mt-6 text-sm">
            <a href="/login" class="text-blue-800 font-medium hover:underline">← Вернуться к входу</a>
        </p>
    </div>
    <script>
        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const code = document.getElementById('code').value;

            const response = await fetch(`/api/verify_code?email=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}`, {
                method: 'POST'
            });

            if (response.ok) {
                alert('Почта подтверждена! Теперь войдите.');
                window.location.href = '/login';
            } else {
                const error = await response.json();
                alert('Ошибка: ' + error.detail);
            }
        });
    </script>
</body>
</html>
