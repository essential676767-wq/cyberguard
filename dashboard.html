<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — CyberGuard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .btn-primary { background-color: #1e3a8a; color: white; transition: background 0.2s; }
        .btn-primary:hover { background-color: #1e40af; }
        .card { background: white; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1); }
        .chat-box { display: none; position: fixed; bottom: 80px; right: 20px; width: 320px; height: 450px; z-index: 100; }
        .chat-open { display: flex; flex-direction: column; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">🛡️</span>
                    <span class="text-xl font-bold text-slate-900">CyberGuard</span>
                </div>
                <div class="flex items-center gap-4 text-sm" id="navActions">
                    <a href="#" onclick="logout()" class="text-red-600 hover:text-red-800 font-medium">Выйти</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-8 flex gap-8">
        <aside class="w-64 flex-shrink-0 hidden md:block">
            <div class="card rounded-xl p-4 sticky top-24">
                <div class="flex items-center gap-3 mb-6 pb-4 border-b border-gray-100">
                    <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-800 font-bold">A</div>
                    <div class="overflow-hidden">
                        <div class="text-sm font-bold text-slate-900 truncate" id="sidebarEmail">Загрузка...</div>
                        <div class="text-xs text-slate-500" id="sidebarRole">Загрузка...</div>
                    </div>
                </div>
                <nav class="space-y-1">
                    <a href="#" class="block px-4 py-2 bg-blue-50 text-blue-800 rounded-lg font-medium text-sm">Мой профиль</a>
                    <a href="#" onclick="toggleChat()" class="block px-4 py-2 text-slate-600 hover:bg-gray-50 rounded-lg text-sm">Поддержка</a>
                </nav>
            </div>
        </aside>

        <div class="flex-1">
            <div class="card p-6 rounded-xl mb-8 flex items-center justify-between">
                <div class="flex items-center gap-6">
                    <div class="w-16 h-16 rounded-full bg-blue-100 flex items-center justify-center text-2xl font-bold text-blue-800">A</div>
                    <div>
                        <div class="flex items-center gap-2">
                            <h2 id="profileEmail" class="text-xl font-bold text-slate-900">Загрузка...</h2>
                            <span id="adminBadge" class="hidden text-blue-500 text-xl" title="Официальный аккаунт">✔</span>
                        </div>
                        <p id="roleText" class="text-sm text-slate-500">Загрузка...</p>
                    </div>
                </div>
                <a href="/" class="text-sm text-blue-800 hover:underline">На главную</a>
            </div>

            <h1 class="text-2xl font-bold text-slate-900 mb-4">Мои заказы</h1>
            <div id="ordersList" class="space-y-4"></div>
        </div>
    </main>

    <button onclick="toggleChat()" class="fixed bottom-6 right-6 bg-blue-800 p-4 rounded-full shadow-lg hover:bg-blue-900 transition z-50 text-white">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    </button>

    <div id="chatBox" class="card chat-box rounded-2xl shadow-2xl p-4 flex-col">
        <div class="flex justify-between items-center mb-2 border-b border-gray-200 pb-2">
            <h3 class="font-bold text-slate-900">Поддержка</h3>
            <button onclick="toggleChat()" class="text-gray-400 hover:text-gray-600">✕</button>
        </div>
        <div id="chatMessages" class="flex-1 overflow-y-auto mb-2 space-y-2 text-sm bg-gray-50 p-2 rounded"></div>
        <div class="flex gap-2">
            <input type="text" id="chatInput" placeholder="Напишите нам..." class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-800">
            <button onclick="sendMessage()" class="btn-primary px-4 py-2 rounded-lg text-white font-bold">→</button>
        </div>
    </div>

    <script>
        const getCookie = (name) => {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        };

        function toggleChat() {
            document.getElementById('chatBox').classList.toggle('chat-open');
            if (document.getElementById('chatBox').classList.contains('chat-open')) loadChatHistory();
        }

        async function loadChatHistory() {
            const token = localStorage.getItem('token') || getCookie('access_token');
            if (!token) return;
            const response = await fetch('/api/chat/history', { headers: { 'Authorization': `Bearer ${token}` } });
            if (response.ok) {
                const messages = await response.json();
                const container = document.getElementById('chatMessages');
                container.innerHTML = '';
                messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = msg.is_admin ? 'bg-blue-100 text-blue-900 p-2 rounded-lg max-w-[80%]' : 'bg-white border border-gray-200 text-slate-800 p-2 rounded-lg ml-auto max-w-[80%]';
                    div.textContent = msg.text;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value;
            if (!text) return;
            const token = localStorage.getItem('token') || getCookie('access_token');
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'bg-white border border-gray-200 text-slate-800 p-2 rounded-lg ml-auto max-w-[80%]';
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            input.value = '';
            await fetch('/api/chat/send', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ text: text }) });
        }

        function logout() {
            localStorage.removeItem('token');
            document.cookie = "access_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
            window.location.href = '/login';
        }

        // --- ЗАКАЗЫ ---
        async function loadOrders() {
            const token = localStorage.getItem('token') || getCookie('access_token');
            const response = await fetch('/api/orders', { headers: { 'Authorization': `Bearer ${token}` } });
            if (response.ok) {
                const orders = await response.json();
                const container = document.getElementById('ordersList');
                container.innerHTML = '';

                if (orders.length === 0) {
                    container.innerHTML = '<p class="text-slate-500 text-sm">У вас пока нет заказов.</p>';
                    return;
                }

                orders.forEach(order => {
                    const statusClass = order.status === 'paid' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';
                    const statusText = order.status === 'paid' ? 'Оплачен' : 'Ожидает оплаты';

                    const div = document.createElement('div');
                    div.className = 'card rounded-xl p-6';
                    div.innerHTML = `
                        <div class="flex justify-between items-center border-b border-gray-100 pb-4 mb-4">
                            <div>
                                <h3 class="font-bold text-slate-900">${order.title}</h3>
                                <p class="text-xs text-slate-500">Заказ №${order.id}</p>
                            </div>
                            <span class="px-3 py-1 rounded-full ${statusClass} text-xs font-semibold">${statusText}</span>
                        </div>
                        <p class="text-sm text-slate-600 mb-4">Проверка вашего сайта на уязвимости.</p>
                        ${order.status !== 'paid' ? `<button onclick="payOrder(${order.id})" class="btn-primary px-6 py-2.5 rounded-md text-sm font-semibold">Оплатить ${order.amount} ₽</button>` : ''}
                        ${order.status === 'pending' ? `<button onclick="confirmPayment(${order.id})" class="bg-green-600 text-white px-6 py-2.5 rounded-md text-sm font-semibold mt-2 ml-2">Я оплатил</button>` : ''}
                    `;
                    container.appendChild(div);
                });
            }
        }

        async function payOrder(orderId) {
            const token = localStorage.getItem('token') || getCookie('access_token');
            const response = await fetch(`/api/pay/${orderId}`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
            if (response.ok) {
                const data = await response.json();
                window.open(data.link, '_blank');
                alert('Переведите 5000 ₽ по открывшейся ссылке. После оплаты нажмите "Я оплатил".');
                loadOrders(); // Обновляем, чтобы появилась кнопка "Я оплатил"
            } else {
                alert('Ошибка создания заказа');
            }
        }

        window.confirmPayment = async (orderId) => {
            const token = localStorage.getItem('token') || getCookie('access_token');
            await fetch(`/api/confirm_payment/${orderId}`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
            alert('Спасибо! Мы проверим оплату и приступим к работе.');
            window.location.reload();
        }

        window.onload = async () => {
            const token = localStorage.getItem('token') || getCookie('access_token');
            if (!token) { window.location.href = '/login'; return; }

            try {
                const response = await fetch('/api/me', { headers: { 'Authorization': `Bearer ${token}` } });
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('profileEmail').textContent = data.email;
                    if(document.getElementById('sidebarEmail')) document.getElementById('sidebarEmail').textContent = data.email;

                    if (data.is_admin) {
                        document.getElementById('adminBadge').classList.remove('hidden');
                        document.getElementById('roleText').textContent = "Администратор";
                        if(document.getElementById('sidebarRole')) document.getElementById('sidebarRole').textContent = "Администратор";

                        const nav = document.getElementById('navActions');
                        nav.innerHTML = `<a href="/admin" class="text-blue-800 font-bold hover:underline mr-4">Админ-панель</a>` + nav.innerHTML;
                    } else {
                        document.getElementById('roleText').textContent = "Клиент";
                        if(document.getElementById('sidebarRole')) document.getElementById('sidebarRole').textContent = "Клиент";
                    }

                    loadOrders();
                    loadChatHistory();
                } else {
                    window.location.href = '/login';
                }
            } catch (e) {
                window.location.href = '/login';
            }
        };
    </script>
</body>
</html>
